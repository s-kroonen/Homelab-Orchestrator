# Release: runs when a person pushes a tag v<x.y.z> on main (after merging release/v<x.y.z>).
# Builds, writes an SBOM and checksums, signs the checksums keyless with cosign, attests provenance,
# publishes the GitHub release with the CHANGELOG section, and opens the PR that merges main back
# into dev (scripts/next-version needs it). Verify a release: docs/process/workflow.md.
# Repository variable RELEASE_ASSETS: glob of the files to publish (e.g. "dist/*"); empty = none.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write        # create the GitHub release
      pull-requests: write   # back-merge PR main -> dev
      id-token: write        # provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: scripts/install-tools
      - name: Full checks on the tagged commit
        run: scripts/check all
      # Windows code signing for desktop builds goes here (signtool / Azure Trusted Signing), using
      # a certificate from a protected environment, BEFORE the checksums are written. Not set up:
      # it needs a certificate this template cannot provide.
      - name: SBOM and checksums
        env:
          ASSETS: ${{ vars.RELEASE_ASSETS }}
        run: |
          mkdir -p release
          trivy fs --quiet --format cyclonedx --output release/sbom.cdx.json .
          if [ -n "$ASSETS" ]; then read -ra assets <<<"$ASSETS"; cp "${assets[@]}" release/; fi
          (cd release && sha256sum -- * > SHA256SUMS)
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Sign the checksums (keyless, GitHub OIDC identity of this workflow)
        run: cosign sign-blob --yes --bundle release/SHA256SUMS.sigstore.json release/SHA256SUMS
      - name: Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::No CHANGELOG.md section for $v (run /release before tagging)."; exit 1; }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md release/*
      - name: Merge main back into dev (PR)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh pr create --base dev --head main --title "chore(release): merge $TAG back into dev" \
            --body "Brings the release commit and tag $TAG into dev, so scripts/next-version counts from it." \
            || echo "::warning::Could not open the back-merge PR (maybe main is already in dev)."
