name: publish

# Build the container image and push it to GitHub Container Registry (GHCR).
#
# When it runs:
#   * push to main         -> tags: main, sha-<short>, edge
#   * push of a semver tag -> tags: <full>, <major>.<minor>, <major>, latest
#                              (e.g. v1.2.3 -> 1.2.3, 1.2, 1, latest)
#   * manual dispatch      -> tag: manual-<sha>
#
# Multi-arch: linux/amd64 (laptops/servers) + linux/arm64 (Raspberry Pi 4/5).
# Uses only $GITHUB_TOKEN — no extra secrets to configure.
#
# Pulling on the Pi:
#     docker login ghcr.io -u <you> -p <PAT with read:packages>   # only for PRIVATE repos
#     export ORCHESTRATOR_IMAGE=ghcr.io/<owner>/homelab-orchestrator:1.0.0
#     docker compose pull && docker compose up -d

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Image name defaults to <owner>/<repo-lowercase>. metadata-action lowercases it.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Re-run tests here too so we never publish an image whose commit didn't pass.
  # ci.yml handles PRs; this handles pushes that trigger a publish.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - run: ruff check src tests
      - run: pytest -q

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to GHCR
      id-token: write        # future: sigstore/cosign keyless signing
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 emulation on amd64 runners)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags + OCI labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # main branch      -> :main, :edge, :sha-<short>
            type=ref,event=branch
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            # semver push tags -> :1.2.3, :1.2, :1, :latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # workflow_dispatch -> :manual-<short>
            type=raw,value=manual-{{sha}},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=homelab-orchestrator
            org.opencontainers.image.description=Control-plane service for a low-power Proxmox homelab
            org.opencontainers.image.licenses=MIT

      - name: Build + push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
