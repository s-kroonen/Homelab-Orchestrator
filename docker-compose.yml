services:
  orchestrator:
    # Default: pull a pinned tag from GHCR (what the Pi does).
    # `:main` is what publish.yml actually tags on every push to main; `:dev`
    # tracks the dev branch the same way for pre-main testing; `:latest`
    # is ONLY tagged when a `vX.Y.Z` release tag is pushed, so it does not exist
    # until the first release and defaulting to it 404s as "manifest unknown".
    # Pin a specific `:sha-<short>` or `:vX.Y.Z` tag for anything beyond casual use.
    # Local dev: run `docker compose build` or `docker compose up --build`
    # to rebuild from the working tree — the `build:` block below is honoured
    # by both `build` and `up --build` subcommands.
    image: ${ORCHESTRATOR_IMAGE:-ghcr.io/s-kroonen/homelab-orchestrator:main}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orchestrator
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Lets the System page say which image tag it follows (for "is there a newer build?").
      ORCHESTRATOR_IMAGE: ${ORCHESTRATOR_IMAGE:-ghcr.io/s-kroonen/homelab-orchestrator:main}
    ports:
      # Loopback by default (safest for a fresh clone). To expose this on the
      # LAN — e.g. a Traefik instance on a DIFFERENT host that needs to reach
      # this one — set ORCHESTRATOR_BIND_ADDR in .env to this host's LAN IP
      # (or 0.0.0.0 for all interfaces). Compose reads .env for both this
      # substitution and the container's own env vars, so no second file is
      # needed. Don't use docker-compose.override.yml for this: Compose
      # CONCATENATES list-type keys like `ports` across files rather than
      # replacing them, so a same-port override here collides with this one
      # instead of replacing it ("address already in use").
      - "${ORCHESTRATOR_BIND_ADDR:-127.0.0.1}:8080:8080"
    volumes:
      - orchestrator_state:/data
      # Mount the config DIRECTORY, not the single file. Two reasons:
      #   1. A single-file bind mount whose host file does not exist makes Docker
      #      silently create a DIRECTORY at that path, and the app then fails with
      #      "Is a directory". Mounting the dir gives a clear "file not found".
      #   2. The dashboard's Save writes services.yaml back via a .tmp sibling +
      #      atomic rename, which needs write access to the directory. A ':ro'
      #      single-file mount makes Save permanently impossible.
      # Your real services.yaml is git-ignored; the example is services.example.yaml.
      - ./config:/etc/orchestrator
      # Optional, fresh installs only: the dashboard's /setup page (web form of
      # `setup init`) needs the project dir AND `environment: SETUP_PROJECT_DIR:
      # /work` on this service. Remove both once setup is done — docs/deploying.md.
      # - ./:/work
      # Optional: mount an NFS-backed dir for periodic state dumps.
      # - /mnt/state-dumps:/mnt/state-dumps
      #
      # Host runner socket — the ONLY thing needed for ansible/ssh probes.
      # A socket is a capability, not a file tree: the container can ask the
      # runner to perform pre-approved checks, and can read neither the
      # inventory, the playbooks, nor any key. See docs/host_runner.md.
      # - /run/orchestrator/host-runner.sock:/run/orchestrator/host-runner.sock
    #
    # The socket is mode 0660, so this container's uid must be in the HOST's
    # socket group. Use the NUMERIC gid from `getent group orchestrator` on the
    # host: group_add resolves names against the CONTAINER's /etc/group, where
    # `orchestrator` is already this image's own group (gid 1000) — the name
    # would resolve to the wrong group and every connect would be refused.
    # group_add:
    #   - "1001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # One-click updates with automatic rollback are a separate, opt-in file
  # (docker-compose.updater.yml: it needs the host's Docker socket). See docs/system.md.

  # One-off setup and config commands, run from the same image:
  #   mkdir -p config && touch .env                  # once, on a fresh install
  #   docker compose run --rm setup init             # clean install: writes .env + config/
  #   docker compose run --rm setup config edit pbs  # change one section of .env
  #   docker compose run --rm setup scaffold         # pull new guests into services.yaml
  #   docker compose run --rm setup probe add <slug>
  # It mounts this directory, because .env is a FILE only here — the orchestrator
  # container receives it as environment variables and cannot rewrite it.
  # Profile-gated, so `docker compose up` never starts it.
  #
  # Compose refuses to run ANY service while .env is missing. That is kept on
  # purpose: it stops `docker compose up` recreating the orchestrator with no
  # config. Hence `touch .env` first — init treats an empty .env as a clean install.
  setup:
    image: ${ORCHESTRATOR_IMAGE:-ghcr.io/s-kroonen/homelab-orchestrator:main}
    profiles: ["setup"]
    entrypoint: ["orchestrator-cli"]
    working_dir: /work
    volumes:
      - ./:/work
      - ./config:/etc/orchestrator
    # No env_file on purpose: the CLI reads /work/.env itself, and `init` has to
    # run before that file exists.
    # Files are written as uid 1000, the image user. If yours differs (id -u):
    #   docker compose run --rm --user "$(id -u):$(id -g)" setup init

volumes:
  orchestrator_state:
    name: orchestrator_state
