{# Grafana-style time controls: range + auto-refresh + manual reload.
   Behaviour lives in static/timecontrols.js; `range` is the server's
   reading of ?range= so the first paint already shows the right option. #}
<div class="timecontrols" data-tc data-default-range="24h" data-default-refresh="30s">
  <label class="tc-field">
    <span class="tc-label">Range</span>
    <select data-tc-range aria-label="Time range">
      {% for key, label in [("15m", "Last 15 minutes"), ("1h", "Last 1 hour"), ("6h", "Last 6 hours"), ("24h", "Last 24 hours"), ("7d", "Last 7 days"), ("14d", "Last 14 days")] %}
      <option value="{{ key }}"{% if key == range %} selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </label>
  <label class="tc-field">
    <span class="tc-label">Refresh</span>
    <select data-tc-refresh aria-label="Auto-refresh interval">
      <option value="off">Off</option>
      <option value="10s">10s</option>
      <option value="30s" selected>30s</option>
      <option value="1m">1m</option>
      <option value="5m">5m</option>
    </select>
  </label>
  <button type="button" class="secondary small tc-reload" data-tc-reload title="Refresh now" aria-label="Refresh now">&#x21bb;</button>
  <span class="tc-updated" data-tc-updated aria-live="polite"></span>
</div>
