<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone dashboard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0d1015}
a{color:#8fb3ff;text-decoration:none}a:hover{color:#b8d0ff}
*{box-sizing:border-box}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.ok{background:#11331f;color:#5fe08b}.warn{background:#3a2c10;color:#f0b44c}.fail{background:#3d1717;color:#ff8a82}.off{background:#232834;color:#b3bccb}.pending{background:#162a45;color:#8fb3ff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 14px;border-radius:10px;border:1px solid #2c3340;background:#1a1f29;color:#e6e9ef;font:600 14px Inter,system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.btn.primary{background:#4f7fe0;border-color:#4f7fe0;color:#fff}
</style>
</helmet>
<div style="width: 390px; height: 1300px; background: #0d1015; color: #e6e9ef; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.45; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid #222833">
    <button class="btn" type="button" aria-label="Menu" style="width: 44px; padding: 0; border-color: transparent; background: transparent">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
    </button>
    <h1 style="margin: 0; font-size: 18px; flex: 1">Dashboard</h1>
    <span class="pill ok">● Live</span>
    <button class="btn" type="button" aria-label="Search" style="width: 44px; padding: 0; border-color: transparent; background: transparent">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    </button>
  </header>

  <main style="flex: 1; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="color: #9aa4b2">3 things need attention.</div>
    <sc-for list="{{attention}}" as="a" hint-placeholder-count="3">
      <article style="background: #141922; border: 1px solid #232a36; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: center; gap: 8px">
          <span class="pill {{a.kind}}">{{a.label}}</span>
          <span style="margin-left: auto; font-size: 12px; color: #8a94a5">{{a.when}}</span>
        </div>
        <div style="font-weight: 600">{{a.title}}</div>
        <div style="font-size: 13.5px; color: #9aa4b2">{{a.detail}}</div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <button class="btn primary" type="button">{{a.action}}</button>
          <a class="btn" href="#">Open</a>
        </div>
      </article>
    </sc-for>

    <h2 style="margin: 6px 0 0; font-size: 15px">Nodes</h2>
    <sc-for list="{{nodes}}" as="n" hint-placeholder-count="2">
      <div style="display: flex; align-items: center; gap: 10px; background: #141922; border: 1px solid #232a36; border-radius: 14px; padding: 10px 12px">
        <span class="pill {{n.kind}}">{{n.state}}</span>
        <div style="flex: 1; min-width: 0"><div style="font-weight: 600">{{n.name}}</div><div style="font-size: 12px; color: #9aa4b2">{{n.detail}}</div></div>
        <button class="btn" type="button">{{n.action}}</button>
      </div>
    </sc-for>

    <h2 style="margin: 6px 0 0; font-size: 15px">Recent</h2>
    <sc-for list="{{activity}}" as="e" hint-placeholder-count="3">
      <div style="display: flex; gap: 10px; font-size: 13.5px; padding: 4px 0">
        <span style="color: #8a94a5; flex: 0 0 42px">{{e.at}}</span><span>{{e.text}}</span>
      </div>
    </sc-for>
  </main>

  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid #222833; background: #11151c; padding: 6px 4px 18px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
      <a href="#" style="{{t.style}}">{{t.label}}</a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    const tab = 'display:flex;align-items:center;justify-content:center;height:48px;border-radius:10px;font-size:13px;font-weight:600;color:#b3bccb';
    return {
      attention: [
        { kind: 'fail', label: 'Failed', when: '12 min', title: 'nextcloud is down', detail: 'https answered 502 twice. The guest is running.', action: 'Check now' },
        { kind: 'warn', label: 'Changed', when: '1 h', title: 'truenas changed outside', detail: 'nas.example.lan is off in Traefik Manager.', action: 'Put it back' },
        { kind: 'warn', label: 'Backup', when: '03:12', title: 'mailcow backup failed', detail: 'PBS datastore is 91% full.', action: 'Open run' },
      ],
      nodes: [
        { kind: 'ok', state: 'on', name: 'node-a', detail: '14 services · always on', action: 'Check' },
        { kind: 'off', state: 'off', name: 'node-b', detail: '6 services · wakes on demand', action: 'Wake' },
      ],
      activity: [
        { at: '14:58', text: 'jellyfin woke node-b (41 s)' },
        { at: '14:31', text: 'nextcloud failed: 502' },
        { at: '13:02', text: 'Deployed site-main' },
      ],
      tabs: [
        { label: 'Dashboard', style: tab + ';background:#1d2430;color:#ffffff' },
        { label: 'Services', style: tab },
        { label: 'Activity', style: tab },
        { label: 'More', style: tab },
      ],
    };
  }
}
</script>
</body>
</html>
